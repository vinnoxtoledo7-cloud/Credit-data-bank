name: BaaS security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  security-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run sandbox endpoint regression tests
        run: node --test tests/baas-security.test.mjs
