<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatórios e conciliação | Credit Payroll</title><style>*{box-sizing:border-box}body{margin:0;background:#081a2d;color:#f2f5fa;font:15px system-ui,Arial}header{padding:20px 5%;background:#102b45}header strong{color:#dfbe75}main{max-width:1080px;margin:auto;padding:24px 16px}.card{background:#122d47;border:1px solid #2b4860;border-radius:16px;padding:20px;margin:16px 0}label{display:block;margin:12px 0}input,select{display:block;width:100%;margin-top:7px;padding:12px;background:#0b2035;color:white;border:1px solid #53697c;border-radius:9px}button{background:#d8b873;border:0;color:#14253a;border-radius:9px;padding:12px 16px;font-weight:700;cursor:pointer;margin:5px}a{color:#dfbe75}.notice{padding:12px;border:1px solid #826e45;border-radius:9px;color:#e3c88f}.muted{color:#a9bfd2}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}td,th{padding:11px;border-bottom:1px solid #35536a;text-align:left}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}section[hidden]{display:none}@media print{body{background:white;color:black}header,nav,button,#login,#msg,.notice{display:none!important}.card{border:0}table{color:black}h1:before{content:"RELATÓRIO DE SIMULAÇÃO - NÃO PAGO";display:block;font-size:16px;color:#a00}}</style></head><body><header><strong>CREDIT DATA BANK</strong> / CREDIT PAYROLL</header><main><nav><a href="./payroll-payments.html">← Pagamentos</a></nav><h1>Relatórios e conciliação</h1><p class="notice">HOMOLOGAÇÃO. Documentos fictícios. Não são comprovantes bancários, não demonstram liquidação e não autorizam pagamentos reais.</p><p id="msg" role="status"></p><section id="login" class="card"><h2>Entrar</h2><form id="auth"><label>E-mail<input type="email" name="email" required></label><label>Senha<input type="password" name="password" required></label><button>Entrar</button></form></section><section id="work" hidden><div class="card"><div class="grid"><label>Empresa<select id="company"></select></label><label>Folha<select id="batch"></select></label></div><button id="csv">Exportar CSV</button><button id="print">Imprimir / Salvar PDF</button></div><div class="card"><h2>Conciliação interna</h2><p id="status"></p><p id="summary"></p><p id="audit" class="muted"></p><div class="scroll"><table><thead><tr><th>Funcionário</th><th>Modalidade</th><th>Valor líquido</th><th>Situação</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.49.10';const db=createClient('https://jruspbiljejmknjvnesd.supabase.co','sb_publishable_02sp2eGomD108oDM1Be8yg_-z7URJmT');const el=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\u0027':'&#39;'}[c]));let batches=[],rows=[],report=null;const msg=s=>el('msg').textContent=s;async function init(){const r=await db.auth.getUser(),logged=!!r.data.user;el('login').hidden=logged;el('work').hidden=!logged;if(!logged)return;const c=await db.from('payroll_companies').select('id,name').order('name');if(c.error)return msg('Erro ao consultar empresas.');el('company').innerHTML=(c.data||[]).map(x=>'<option value="'+safe(x.id)+'">'+safe(x.name)+'</option>').join('');await companies()}el('auth').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(r.error)return msg('Falha no login.');await init()};el('company').onchange=companies;el('batch').onchange=details;async function companies(){const r=await db.from('payroll_batches').select('id,competence,status,payment_timing,scheduled_date').eq('company_id',el('company').value).order('created_at',{ascending:false});if(r.error)return msg('Erro ao consultar folhas.');batches=r.data||[];el('batch').innerHTML=batches.map(x=>'<option value="'+safe(x.id)+'">'+safe(x.competence)+' · '+safe(x.status)+'</option>').join('');await details()}async function details(){report=null;rows=[];el('rows').innerHTML='';el('status').textContent='';el('summary').textContent='';el('audit').textContent='';const b=batches.find(x=>x.id===el('batch').value);if(!b){msg('Nenhuma folha encontrada.');return}const [i,e,s]=await Promise.all([db.from('payroll_batch_items').select('employee_id,net_amount').eq('batch_id',b.id),db.from('payroll_employees').select('id,full_name,payment_method').eq('company_id',el('company').value),db.from('payroll_payment_simulations').select('id,simulated_at,item_count,total_amount,pix_amount,bank_amount').eq('batch_id',b.id).maybeSingle()]);if(i.error||e.error||s.error)return msg('Não foi possível carregar a conciliação.');const people=Object.fromEntries((e.data||[]).map(x=>[x.id,x]));rows=(i.data||[]).map(x=>({name:people[x.employee_id]?.full_name||'Funcionário',method:people[x.employee_id]?.payment_method==='pix'?'Pix':'Transferência',amount:Number(x.net_amount)}));const total=rows.reduce((a,x)=>a+x.amount,0),pix=rows.filter(x=>x.method==='Pix').reduce((a,x)=>a+x.amount,0),bank=total-pix;const sim=s.data;const match=!!sim&&b.status==='approved'&&sim.item_count===rows.length&&Math.abs(Number(sim.total_amount)-total)<0.005&&Math.abs(Number(sim.pix_amount)-pix)<0.005&&Math.abs(Number(sim.bank_amount)-bank)<0.005;const status=!sim?'Sem processamento simulado':match?'Conferência interna consistente':'DIVERGÊNCIA ENTRE FOLHA E SIMULAÇÃO';el('status').textContent='Status: '+status;el('summary').textContent='Competência '+b.competence+' | '+rows.length+' lançamentos | Pix '+fmt(pix)+' | Transferências '+fmt(bank)+' | Total '+fmt(total);el('audit').textContent=sim?'Registro '+sim.id+' | '+new Date(sim.simulated_at).toLocaleString('pt-BR')+' | Nenhum pagamento bancário executado.':'Sem registro de simulação. Nenhum pagamento bancário executado.';el('rows').innerHTML=rows.map(x=>'<tr><td>'+safe(x.name)+'</td><td>'+safe(x.method)+'</td><td>'+fmt(x.amount)+'</td><td>SIMULAÇÃO / NÃO PAGO</td></tr>').join('');report={competence:b.competence,status,total,pix,bank,simid:sim?.id||'',date:sim?.simulated_at||'',company:el('company').selectedOptions[0]?.textContent||''};msg('Relatório carregado. Conciliação apenas interna, sem extrato bancário.')};el('csv').onclick=()=>{if(!report)return msg('Selecione uma folha.');const q=v=>String(v??'').replaceAll('"','""');const data=[['RELATÓRIO DE SIMULAÇÃO - NÃO PAGO'],['Empresa',report.company],['Competência',report.competence],['Status',report.status],['ID simulação',report.simid],['Funcionário','Modalidade','Valor (R$)','Situação'],...rows.map(x=>[x.name,x.method,x.amount.toFixed(2),'SIMULAÇÃO - NÃO PAGO'])];const csv='\uFEFF'+data.map(line=>line.map(v=>'"'+q(v)+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='credit-payroll-relatorio-'+report.competence+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};el('print').onclick=()=>{if(!report)return msg('Selecione uma folha.');window.print()};init().catch(()=>msg('Falha ao iniciar.'));</script></body></html>
