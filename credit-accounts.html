<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credit Accounts | Homologação</title><style>*{box-sizing:border-box}body{margin:0;background:#081a2d;color:#f2f5fa;font:15px system-ui,Arial}header{padding:20px 5%;background:#102b45;border-bottom:1px solid #29445b}header strong{color:#dfbe75}main{max-width:1050px;margin:auto;padding:24px 16px}.card{background:#122d47;border:1px solid #2b4860;border-radius:16px;padding:20px;margin:16px 0}label{display:block;margin:12px 0}input,select{display:block;width:100%;margin-top:7px;padding:12px;background:#0b2035;color:white;border:1px solid #53697c;border-radius:9px}button{background:#d8b873;border:0;color:#14253a;border-radius:9px;padding:12px 16px;font-weight:700;cursor:pointer}a{color:#dfbe75}.notice{padding:12px;border:1px solid #826e45;border-radius:9px;color:#e3c88f}.muted{color:#a9bfd2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}section[hidden]{display:none}.balance{font-size:25px;color:#dfbe75;font-weight:bold}.account{border:1px solid #35536a;padding:16px;border-radius:12px}</style></head><body><header><strong>CREDIT DATA BANK</strong> / CREDIT ACCOUNTS</header><main><a href="./payroll.html">← Credit Payroll</a><h1>Contas digitais PF e PJ</h1><p class="notice">AMBIENTE DE HOMOLOGAÇÃO. Contas e saldos fictícios. Não são contas bancárias reais, não recebem depósitos e não fazem pagamentos.</p><p id="msg" role="status"></p><section id="login" class="card"><h2>Acessar</h2><form id="auth"><label>E-mail<input type="email" name="email" required></label><label>Senha<input type="password" name="password" required></label><button>Entrar</button></form></section><section id="work" hidden><div class="card"><h2>Criar conta de teste</h2><form id="create"><div class="grid"><label>Tipo<select name="account_type"><option value="PF">Pessoa física (PF)</option><option value="PJ">Pessoa jurídica (PJ)</option></select></label><label>Nome de exibição<input name="display_name" minlength="2" maxlength="120" placeholder="Titular ou empresa" required></label></div><button>Criar conta fictícia</button></form></div><div class="card"><h2>Minhas contas</h2><div id="accounts" class="grid"></div></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.49.10';const db=createClient('https://jruspbiljejmknjvnesd.supabase.co','sb_publishable_02sp2eGomD108oDM1Be8yg_-z7URJmT'),el=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user=null;const msg=s=>el('msg').textContent=s;async function init(){const r=await db.auth.getUser();user=r.data.user;el('login').hidden=!!user;el('work').hidden=!user;if(user)await load()}el('auth').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(r.error)return msg('Falha no login.');await init()};el('create').onsubmit=async e=>{e.preventDefault();if(!user)return;const f=new FormData(e.target);const r=await db.from('credit_accounts').insert({owner_id:user.id,account_type:f.get('account_type'),display_name:String(f.get('display_name')).trim()});if(r.error)return msg('Não foi possível criar conta: '+r.error.message);e.target.reset();msg('Conta fictícia criada. Nenhum vínculo bancário foi aberto.');await load()};async function load(){const r=await db.from('credit_accounts').select('id,account_type,display_name,status,created_at').order('created_at',{ascending:false});if(r.error)return msg('Erro ao carregar contas.');const accounts=r.data||[];el('accounts').innerHTML=accounts.length?accounts.map(x=>'<div class="account"><strong>'+safe(x.account_type)+' · '+safe(x.display_name)+'</strong><p class="muted">Conta de homologação</p><div class="balance">R$ 0,00</div><p class="muted">Saldo fictício inicial. Extrato e lançamentos na próxima etapa.</p><small>Identificador interno: '+safe(x.id)+'</small></div>').join(''):'<p>Nenhuma conta fictícia cadastrada.</p>'}init().catch(()=>msg('Falha ao iniciar.'));</script></body></html>
