<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credit Accounts | Homologação</title><style>*{box-sizing:border-box}body{margin:0;background:#081a2d;color:#f2f5fa;font:15px system-ui,Arial}header{padding:20px 5%;background:#102b45;border-bottom:1px solid #29445b}header strong{color:#dfbe75}main{max-width:1050px;margin:auto;padding:24px 16px}.card{background:#122d47;border:1px solid #2b4860;border-radius:16px;padding:20px;margin:16px 0}label{display:block;margin:12px 0}input,select{display:block;width:100%;margin-top:7px;padding:12px;background:#0b2035;color:white;border:1px solid #53697c;border-radius:9px}button{background:#d8b873;border:0;color:#14253a;border-radius:9px;padding:12px 16px;font-weight:700;cursor:pointer}a{color:#dfbe75}.notice{padding:12px;border:1px solid #826e45;border-radius:9px;color:#e3c88f}.muted{color:#a9bfd2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}section[hidden]{display:none}.balance{font-size:25px;color:#dfbe75;font-weight:bold}.account{border:1px solid #35536a;padding:16px;border-radius:12px}</style></head><body><header><strong>CREDIT DATA BANK</strong> / CREDIT ACCOUNTS</header><main><a href="./payroll.html">← Credit Payroll</a><h1>Contas digitais PF e PJ</h1><p class="notice">AMBIENTE DE HOMOLOGAÇÃO. Contas e saldos fictícios. Não são contas bancárias reais, não recebem depósitos e não fazem pagamentos.</p><p id="msg" role="status"></p><section id="login" class="card"><h2>Acessar</h2><form id="auth"><label>E-mail<input type="email" name="email" required></label><label>Senha<input type="password" name="password" required></label><button>Entrar</button></form></section><section id="work" hidden><div class="card"><h2>Criar conta de teste</h2><form id="create"><div class="grid"><label>Tipo<select name="account_type"><option value="PF">Pessoa física (PF)</option><option value="PJ">Pessoa jurídica (PJ)</option></select></label><label>Nome de exibição<input name="display_name" minlength="2" maxlength="120" placeholder="Titular ou empresa" required></label></div><button>Criar conta fictícia</button></form></div><div class="card"><h2>Minhas contas</h2><div id="accounts" class="grid"></div><h2>Extrato e lançamentos de teste</h2><label>Conta<select id="selected"></select></label><p id="balance" class="balance">R$ 0,00</p><form id="entry"><label>Tipo<select name="kind"><option value="demo_credit">Crédito fictício</option><option value="demo_debit">Débito fictício</option></select></label><label>Valor (R$)<input name="amount" type="number" min="0.01" max="1000000" step="0.01" required></label><label>Descrição<input name="description" minlength="3" maxlength="150" required></label><button>Registrar lançamento fictício</button></form><div id="statement"></div></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.49.10';const db=createClient('https://jruspbiljejmknjvnesd.supabase.co','sb_publishable_02sp2eGomD108oDM1Be8yg_-z7URJmT'),el=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user=null;const msg=s=>el('msg').textContent=s;async function init(){const r=await db.auth.getUser();user=r.data.user;el('login').hidden=!!user;el('work').hidden=!user;if(user)await load()}el('auth').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(r.error)return msg('Falha no login.');await init()};el('selected').onchange=statement;el('entry').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const id=el('selected').value;if(!id)return msg('Selecione uma conta.');const r=await db.rpc('credit_demo_entry',{p_account:id,p_kind:f.get('kind'),p_amount:Number(f.get('amount')),p_description:f.get('description')});if(r.error)return msg('Lançamento não registrado: '+r.error.message);e.target.reset();msg('Lançamento fictício registrado.');await load()};async function statement(){const id=el('selected').value;el('statement').innerHTML='';el('balance').textContent='R$ 0,00';if(!id)return;const r=await db.from('credit_account_ledger').select('amount,description,entry_type,created_at').eq('account_id',id).order('created_at',{ascending:false});if(r.error)return msg('Erro ao carregar extrato.');const entries=r.data||[];const fmt=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});el('balance').textContent='Saldo fictício: '+fmt(entries.reduce((s,x)=>s+Number(x.amount),0));el('statement').innerHTML=entries.length?entries.map(x=>'<p>'+safe(new Date(x.created_at).toLocaleString('pt-BR'))+' · '+safe(x.description)+' · '+fmt(x.amount)+' · SIMULAÇÃO</p>').join(''):'<p class="muted">Nenhum lançamento fictício.</p>'}el('create').onsubmit=async e=>{e.preventDefault();if(!user)return;const f=new FormData(e.target);const r=await db.from('credit_accounts').insert({owner_id:user.id,account_type:f.get('account_type'),display_name:String(f.get('display_name')).trim()});if(r.error)return msg('Não foi possível criar conta: '+r.error.message);e.target.reset();msg('Conta fictícia criada. Nenhum vínculo bancário foi aberto.');await load()};async function load(){const r=await db.from('credit_accounts').select('id,account_type,display_name,status,created_at').order('created_at',{ascending:false});if(r.error)return msg('Erro ao carregar contas.');const accounts=r.data||[];const all=await db.from('credit_account_ledger').select('account_id,amount').in('account_id',accounts.map(x=>x.id).length?accounts.map(x=>x.id):['00000000-0000-0000-0000-000000000000']);if(all.error)return msg('Erro ao consultar saldos.');const balances={};for(const x of all.data||[])balances[x.account_id]=(balances[x.account_id]||0)+Number(x.amount);const old=el('selected').value;el('selected').innerHTML=accounts.map(x=>'<option value="'+safe(x.id)+'">'+safe(x.account_type)+' · '+safe(x.display_name)+'</option>').join('');if(accounts.some(x=>x.id===old))el('selected').value=old;await statement();el('accounts').innerHTML=accounts.length?accounts.map(x=>'<div class="account"><strong>'+safe(x.account_type)+' · '+safe(x.display_name)+'</strong><p class="muted">Conta de homologação</p><div class="balance">'+Number(balances[x.id]||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})+'</div><p class="muted">Saldo fictício calculado pelo extrato.</p><small>Identificador interno: '+safe(x.id)+'</small></div>').join(''):'<p>Nenhuma conta fictícia cadastrada.</p>'}init().catch(()=>msg('Falha ao iniciar.'));</script></body></html>
