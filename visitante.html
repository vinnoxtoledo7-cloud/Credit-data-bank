<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#071a3c"><title>Credit Data Bank | Visitante 01</title><style>
*{box-sizing:border-box}body{margin:0;font:15px Inter,system-ui,-apple-system,Arial,sans-serif;color:#102847;background:radial-gradient(circle at 80% 5%,#dbe9fb,transparent 34%),#f5f7fb}.wrap{max-width:1050px;margin:auto;padding:24px 18px 120px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.logo{font-size:32px;font-weight:900;letter-spacing:-2px;color:#071a3c}.logo span{color:#fa591c}.tag{font-size:11px;font-weight:800;color:#9d481e;background:#fff0e7;border:1px solid #ffd6c1;border-radius:20px;padding:9px}.welcome h1{font-size:clamp(24px,5vw,35px);margin:0 0 6px}.welcome p,.muted{color:#65758c}.balance{margin:25px 0 18px;background:linear-gradient(125deg,#071a3c,#123f75 75%,#1a5689);color:white;border-radius:26px;padding:30px;box-shadow:0 20px 40px #071a3c26}.balance .muted{color:#cbd8e9}.amount{font-size:clamp(36px,7vw,54px);font-weight:800;letter-spacing:-2px;margin:15px 0}.balance button{background:#ffffff20;color:white;border:1px solid #ffffff50;border-radius:10px;padding:9px 13px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.action,.panel,.glass{background:rgba(255,255,255,.8);border:1px solid #ffffffea;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 25px #0d274512;border-radius:20px}.action{padding:22px 8px;cursor:pointer;color:#123253;font-weight:700}.action .ico{display:block;font-size:27px;color:#fa591c;margin-bottom:8px}.panel{padding:22px;margin-top:22px}.panel h2{margin:0 0 18px;font-size:20px}.transaction{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #e7edf4;padding:14px 0}.transaction:last-child{border:0}.transaction small{display:block;color:#697d94;margin-top:5px}.positive{color:#14785c}.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);display:flex;justify-content:space-around;gap:3px;padding:10px 7px max(12px,env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:#ffffffdb;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 -8px 30px #071a3c1c}.bottom button{flex:1;border:0;background:none;color:#65758c;font:600 11px system-ui;padding:4px 0;cursor:pointer}.bottom button span{display:block;font-size:23px;margin-bottom:4px}.bottom button.active{color:#ef5a1e}.bottom button.ai span{background:#fa591c;color:#fff;width:39px;height:39px;border-radius:13px;margin:-12px auto 3px;padding-top:6px}.notice{padding:14px 16px;border-radius:14px;background:#fff4e9;color:#87502e;font-size:13px;margin-top:22px}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.links button{padding:18px;text-align:left;border:1px solid #e3eaf2;background:#fff;border-radius:14px;font-weight:700;color:#173354;cursor:pointer}.links button span{color:#fa591c;margin-right:10px}.hidden{display:none!important}button:focus-visible{outline:3px solid #fa591c;outline-offset:3px}@media(max-width:540px){.wrap{padding:18px 14px 120px}.actions{gap:8px}.action{padding:17px 3px;font-size:12px}.balance{padding:24px}.links{grid-template-columns:1fr}}@media(prefers-reduced-transparency:reduce){.action,.panel,.glass,.bottom{backdrop-filter:none;-webkit-backdrop-filter:none;background:white}}
</style></head><body><div class="wrap"><header class="head"><div class="logo">cd<span>.</span></div><div class="tag">VISITANTE 01 · DEMO</div></header><section class="welcome"><h1 id="title">Olá, visitante 👋</h1><p>Conheça o Credit Data Bank em nosso ambiente de apresentação.</p></section><main id="main"></main><div class="notice">Demonstração pública. Todos os saldos e lançamentos são fictícios. Nenhuma operação bancária é realizada.</div></div><nav class="bottom" aria-label="Navegação demonstrativa"><button data-page="home" class="active"><span>⌂</span>Início</button><button data-page="pix"><span>⇄</span>Pix</button><button data-page="ai" class="ai"><span>✦</span>Credit AI</button><button data-page="statement"><span>▤</span>Extrato</button><button data-page="more"><span>☷</span>Mais</button></nav><script>
const main=document.getElementById('main');let visible=true;
const transactions=[['Pagamento demonstrativo','Hoje, 10:30','− R$ 85,90',false],['Transferência recebida (demo)','Ontem, 16:20','+ R$ 250,00',true],['Compra demonstrativa','08 nov, 14:05','− R$ 42,50',false]];
const transactionHtml=()=>transactions.map(([name,date,value,positive])=>'<div class="transaction"><div><strong>'+name+'</strong><small>'+date+'</small></div><strong class="'+(positive?'positive':'')+'">'+value+'</strong></div>').join('');
function go(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const titles={home:'Olá, visitante 👋',pix:'Pix demonstrativo',ai:'Credit AI',statement:'Extrato demonstrativo',more:'Todos os serviços'};document.getElementById('title').textContent=titles[page]||titles.home;
if(page==='home'){main.innerHTML='<section class="balance"><div class="muted">Saldo disponível · Fictício</div><div class="amount" id="amount">'+(visible?'R$ 12.450,80':'R$ ••••••')+'</div><button id="toggle">◉ '+(visible?'Ocultar':'Mostrar')+' saldo</button><p class="muted">Conta demonstrativa PF · Sem vínculo bancário</p></section><section class="actions"><button class="action" data-go="pix"><span class="ico">↗</span>Pix</button><button class="action" data-go="pix"><span class="ico">⇄</span>Transferir</button><button class="action" data-go="statement"><span class="ico">▤</span>Extrato</button><button class="action" data-go="more"><span class="ico">▥</span>Serviços</button></section><section class="panel"><h2>Últimas movimentações</h2>'+transactionHtml()+'</section>';document.getElementById('toggle').onclick=()=>{visible=!visible;go('home')}}else if(page==='statement'){main.innerHTML='<section class="panel"><h2>Movimentações fictícias</h2>'+transactionHtml()+'</section>'}else if(page==='pix'){main.innerHTML='<section class="panel"><h2>Área Pix</h2><p class="muted">Conheça como ficará o acesso às operações Pix. Nesta demonstração nenhuma transferência é enviada.</p><div class="links"><button data-info="Enviar Pix">↗ Enviar Pix</button><button data-info="Receber Pix">↙ Receber Pix</button><button data-info="Minhas chaves">⌗ Minhas chaves</button><button data-info="Comprovantes">▤ Comprovantes</button></div></section>'}else if(page==='ai'){main.innerHTML='<section class="panel"><h2>✦ Seu assistente bancário</h2><p class="muted">Prévia da central de inteligência artificial. Respostas e transações reais não estão habilitadas nesta apresentação.</p><div class="links"><button data-go="statement">▤ Ver meu extrato</button><button data-go="pix">⇄ Como funciona o Pix?</button><button data-go="more">▥ Explorar serviços</button></div></section>'}else{main.innerHTML='<section class="panel"><h2>Explore o banco</h2><div class="links"><button data-info="Contas PF e PJ"><span>▥</span>Contas PF/PJ</button><button data-info="Cartões"><span>▣</span>Cartões</button><button data-info="Folha de pagamento"><span>▤</span>Folha de pagamento</button><button data-info="Perfil"><span>♙</span>Meu perfil</button><button data-info="Configurações"><span>⚙</span>Configurações</button></div></section>'}
main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));main.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>alert(b.dataset.info+' estará disponível em uma versão futura. Esta é uma demonstração visual sem operações reais.'))}
document.querySelectorAll('.bottom [data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));go('home');
</script></body></html>
